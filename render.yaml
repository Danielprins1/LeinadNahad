# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: leinad-nahad
    runtime: node
    plan: free # 'starter' voorkomt in slaap vallen en houdt de server altijd wakker
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
